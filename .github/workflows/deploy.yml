# Pipeline de banklite-monitoring: pruebas en cada pull request.
#
# Llama a la copia local del workflow compartido (./.github/workflows/servicio.yml): el repositorio
# banklite-pipelines es privado y de otro dueño, y GitHub no deja llamarlo desde aquí.
# Hay dos servicios en este repositorio, cada uno con su Dockerfile y su prueba de imagen.
#
# Este workflow solo corre en pull requests (pruebas y prueba de las imágenes); un push a main
# no lo dispara. Prometheus y Grafana están desplegados en Railway, fuera de este workflow.

name: Pruebas

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  prometheus:
    uses: ./.github/workflows/servicio.yml
    with:
      servicio: prometheus
      dockerfile: prometheus/Dockerfile
      contexto: .
      # Construye la imagen de Prometheus y prueba la configuración y el arranque.
      prueba-extra: sh scripts/probar-imagenes.sh prometheus
    secrets: inherit

  grafana:
    uses: ./.github/workflows/servicio.yml
    with:
      servicio: grafana
      dockerfile: grafana/Dockerfile
      contexto: .
      # Construye la imagen de Grafana y prueba que no arranca sin credenciales y que exige sesión.
      prueba-extra: sh scripts/probar-imagenes.sh grafana
    secrets: inherit
